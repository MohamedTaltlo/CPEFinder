name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Test compilation
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H=windowsgui -s -w -X main.appVersion=0.2.0" -o dist/CPEFinder.exe .

      - name: SHA256
        run: sha256sum dist/CPEFinder.exe > dist/CPEFinder.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPEFinder-windows-amd64
          path: |
            dist/CPEFinder.exe
            dist/CPEFinder.exe.sha256
          if-no-files-found: error
