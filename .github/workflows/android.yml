name: Build Android

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android Studio project
        run: |
          mkdir -p build-android
          unzip -q android/CPEFinder_Android_Studio_V2_COMPLETE.zip -d build-android
          chmod +x build-android/CPEFinder_Android_Studio_V2/gradlew

      - name: Build debug APK
        working-directory: build-android/CPEFinder_Android_Studio_V2
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPEFinder-Android-v2-debug
          path: build-android/CPEFinder_Android_Studio_V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
