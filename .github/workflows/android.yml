name: Build Android

on:
  push:
    branches: [ "main" ]
    paths:
      - "android-src/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-src/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-src --no-daemon :app:assembleDebug

      - name: Package Android Studio project
        run: |
          cd android-src
          zip -qr ../CPEFinder_Android_Studio_V2_COMPLETE.zip .

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPEFinder-Android-v2
          path: |
            android-src/app/build/outputs/apk/debug/app-debug.apk
            CPEFinder_Android_Studio_V2_COMPLETE.zip
          if-no-files-found: error
